# OpenAPI de lo que Billing API implementa HOY. Sigue openapi/billing.yaml del repo de contratos (que manda) y crece
# con cada incremento. Los componentes comunes son los del contrato.
openapi: 3.1.0
info:
  title: Billing API
  version: 0.9.0
  description: Operación comercial de cada organización con sus clientes. La organización sale del token (org_id + membresía activa).
servers:
  - url: http://localhost:8081
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      security: []
      summary: El proceso vive.
      responses:
        '200': { description: OK }
  /readyz:
    get:
      security: []
      summary: La base y el JWKS responden.
      responses:
        '200': { description: Listo }
        '503': { description: Alguna dependencia no responde }
  /v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Lista clientes (búsqueda por nombre o identificación). Todos los roles.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Nombre legal, comercial o número de identificación (contiene). }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Página de clientes, ordenada por createdAt y id.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Crea un cliente activo. Identificación única por organización. owner, admin, biller.
      description: >
        Idempotente: la misma Idempotency-Key con el mismo contenido devuelve 201 con el cliente ya creado
        (header Idempotent-Replayed, con su estado actual); con otro contenido, 422 idempotency-key-reused.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Detalle. Todos los roles. De otra organización o inexistente, 404.
      responses:
        '200': { description: Cliente, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [customers]
      operationId: updateCustomer
      summary: Edita o desactiva (isActive false). La identificación no se edita. No altera documentos emitidos. owner, admin, biller.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPatch' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Lista productos y servicios con sus impuestos (búsqueda por código o descripción). Todos los roles.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Página de productos, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [products]
      operationId: createProduct
      summary: Crea un producto o servicio con CABYS e impuestos. Código único por organización (409). owner, admin, biller.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [products]
      operationId: getProduct
      summary: Detalle con impuestos. Todos los roles.
      responses:
        '200': { description: Producto, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Edita o desactiva. Acepta un ProductInput completo o solo los campos que cambian (ADR 0004). owner, admin, biller.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPatch' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/invoices:
    get:
      tags: [invoices]
      operationId: listInvoices
      summary: Lista facturas con líneas y totales. Todos los roles.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: documentType, in: query, schema: { type: string, enum: [invoice, credit_note, debit_note] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, issued, cancelled] } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: requiresCorrection, in: query, schema: { type: boolean } }
        - { name: issuedFrom, in: query, schema: { type: string, format: date }, description: Fecha de emisión en la zona de la organización. }
        - { name: issuedTo, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Página de documentos, content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePage' } } } }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [invoices]
      operationId: createInvoice
      summary: Crea un borrador con líneas opcionales. Solo documentType invoice (notas en F5). owner, admin, biller.
      description: >
        Cliente, sucursal y productos se validan contra la organización activa (de otra organización: 404; cliente
        inactivo: 422 customer-inactive). El snapshot de cada línea y la tasa de sus impuestos salen del producto y del
        catálogo fiscal.tax_rates, nunca del cuerpo. exchangeRate es 1 en la moneda local y obligatorio en otra.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDraftInput' } } } }
      responses:
        '201': { description: Borrador creado, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/invoices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [invoices]
      operationId: getInvoice
      summary: Detalle con líneas, impuestos y totales. Todos los roles.
      responses:
        '200': { description: Documento, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [invoices]
      operationId: updateInvoiceDraft
      summary: Edita el encabezado (y reemplaza las líneas si vienen). Solo en draft (409 invoice-not-draft). owner, admin, biller.
      description: Campo ausente = no cambia; branchId o creditTermDays en null los quitan. Cambiar la moneda exige reenviar las líneas.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDraftPatch' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [invoices]
      operationId: discardInvoiceDraft
      summary: Descarta un borrador (se borra; queda en la auditoría). Nunca un emitido (409). owner, admin, biller.
      responses:
        '204': { description: Descartado }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/invoices/{id}/lines:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [invoices]
      operationId: replaceInvoiceLines
      summary: Reemplaza las líneas del borrador y recalcula (D2). Solo en draft. owner, admin, biller.
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/InvoiceLineInput' } } } }
      responses:
        '200': { description: Documento recalculado, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/invoices/{id}/issue:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [invoices]
      operationId: issueInvoice
      summary: draft → issued. Número visible, snapshots, historial, audit e InvoiceIssued v1 en el outbox, en una transacción. owner, admin, biller.
      description: >
        No llama a ningún otro servicio (emite aunque E-Invoice esté caída). La misma Idempotency-Key responde el mismo
        201 (header Idempotent-Replayed); emitir un documento ya emitido con otra clave es 409 invoice-not-draft.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      responses:
        '201': { description: Emitido, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem', description: 'invoice-without-lines, customer-inactive, validation, idempotency-key-reused' }
  /v1/invoices/{id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [invoices]
      operationId: getInvoiceHistory
      summary: Cambios de estado (la creación de un borrador no es una transición). Todos los roles.
      responses:
        '200':
          description: Cambios de estado
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [toStatus, changedAt]
                  properties:
                    fromStatus: { type: string, enum: [draft, issued, cancelled] }
                    toStatus: { type: string, enum: [draft, issued, cancelled] }
                    reason: { type: string }
                    changedByUserId: { type: string, format: uuid }
                    changedAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }

  /internal/v1/invoices/{id}/summary:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [internal]
      operationId: getInvoiceSummary
      summary: Resumen para el Portal Gateway (openapi/bff-internal.yaml del contrato). Sin líneas. Todos los roles.
      description: |
        Solo la consume el Portal Gateway, con el token del usuario (no uno de servicio): misma tenancy, mismos
        permisos y mismos errores que GET /v1/invoices/{id}. Que no se alcance desde afuera es tarea del despliegue.
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema:
                type: object
                required: [id, documentType, status, currency, total]
                properties:
                  id: { type: string, format: uuid }
                  documentType: { type: string, enum: [invoice, credit_note, debit_note] }
                  number: { type: [string, 'null'], description: null en borrador }
                  status: { type: string, enum: [draft, issued, cancelled] }
                  requiresCorrection: { type: boolean }
                  customerLegalName: { type: string, description: Del snapshot del cliente; se omite en borrador }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
                  total: { type: string, description: Monto decimal como string }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/document-sequences:
    get:
      tags: [numbering]
      operationId: listDocumentSequences
      summary: Secuencias de numeración visible por tipo de documento y sucursal. owner, admin.
      responses:
        '200': { description: Secuencias, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DocumentSequence' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/document-sequences/{documentType}:
    parameters:
      - { name: documentType, in: path, required: true, schema: { type: string, enum: [invoice, credit_note, debit_note] } }
    put:
      tags: [numbering]
      operationId: configureDocumentSequence
      summary: Configura prefijo y próximo número (de la organización o de una sucursal). Solo si nunca se usó. owner, admin.
      description: >
        409 sequence-in-use si la secuencia ya asignó números; 409 conflict si otra secuencia del mismo tipo usa el
        prefijo (los números chocarían). Número visible = prefijo + número con 8 dígitos (ADR 0006).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentSequenceInput' } } } }
      responses:
        '200': { description: Configurada, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentSequence' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Access token de Supabase Auth con org_id. }
  responses:
    Problem:
      description: 'Problem Details (RFC 9457), type urn:rdl:billing:problem:<código>.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    Identification:
      type: object
      required: [typeCode, number]
      properties:
        typeCode: { type: string, minLength: 1, maxLength: 10 }
        number: { type: string, minLength: 1, maxLength: 30 }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [identification, legalName]
      properties:
        identification: { $ref: '#/components/schemas/Identification' }
        legalName: { type: string, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 500 }
    CustomerPatch:
      type: object
      additionalProperties: false
      description: Campo ausente = no cambia; "" en tradeName, email, phone o address lo borra.
      properties:
        legalName: { type: string, minLength: 1, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 500 }
        isActive: { type: boolean }
    Customer:
      type: object
      required: [id, identification, legalName, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        identification: { $ref: '#/components/schemas/Identification' }
        legalName: { type: string, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 500 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        nextCursor: { type: [string, 'null'] }
    Money: { type: string, pattern: '^(0|[1-9][0-9]{0,12})(\.[0-9]{1,5})?$', description: 'Monto como string decimal (nunca number).' }
    FiscalCode: { type: string, pattern: '^[0-9A-Za-z._-]{1,20}$', description: 'TODO(fiscal): valores del catálogo.' }
    ProductTax:
      type: object
      additionalProperties: false
      required: [taxTypeCode, taxRateCode]
      properties:
        taxTypeCode: { $ref: '#/components/schemas/FiscalCode' }
        taxRateCode: { $ref: '#/components/schemas/FiscalCode' }
    ProductInput:
      type: object
      additionalProperties: false
      required: [code, description, cabysCode, unitOfMeasureCode, unitPrice, currency, isService]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, minLength: 1, maxLength: 200 }
        cabysCode: { type: string, pattern: '^[0-9]{13}$' }
        unitOfMeasureCode: { $ref: '#/components/schemas/FiscalCode' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        isService: { type: boolean }
        isActive: { type: boolean, default: true }
        taxes: { type: array, items: { $ref: '#/components/schemas/ProductTax' }, description: A lo sumo uno por taxTypeCode. }
    ProductPatch:
      type: object
      additionalProperties: false
      description: Campo ausente = no cambia; taxes presente reemplaza la lista ([] la vacía).
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, minLength: 1, maxLength: 200 }
        cabysCode: { type: string, pattern: '^[0-9]{13}$' }
        unitOfMeasureCode: { $ref: '#/components/schemas/FiscalCode' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        isService: { type: boolean }
        isActive: { type: boolean }
        taxes: { type: array, items: { $ref: '#/components/schemas/ProductTax' } }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, isActive, taxes, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        nextCursor: { type: [string, 'null'] }
    InvoiceLineInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      description: >
        Línea de un producto de la organización. CABYS, descripción, unidad e impuestos se copian del producto; la tasa
        sale de fiscal.tax_rates. unitPrice es obligatorio si el producto está en otra moneda que el documento.
        Líneas libres (sin productId): propuesta pendiente al contrato.
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: string, pattern: '^(0|[1-9][0-9]{0,12})(\.[0-9]{1,3})?$' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        discountReason: { type: string, maxLength: 80, description: Obligatorio si discount no es cero. }
    InvoiceDraftInput:
      type: object
      additionalProperties: false
      required: [documentType, customerId, saleConditionCode, currency]
      properties:
        documentType: { type: string, enum: [invoice], description: 'credit_note y debit_note llegan en F5.' }
        customerId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        saleConditionCode: { $ref: '#/components/schemas/FiscalCode' }
        creditTermDays: { type: integer, minimum: 0, maximum: 3650 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        exchangeRate: { $ref: '#/components/schemas/Money' }
        notes: { type: string, maxLength: 2000 }
        lines: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/InvoiceLineInput' } }
    InvoiceDraftPatch:
      type: object
      additionalProperties: false
      properties:
        documentType: { type: string, enum: [invoice] }
        customerId: { type: string, format: uuid }
        branchId: { type: [string, 'null'], format: uuid }
        saleConditionCode: { $ref: '#/components/schemas/FiscalCode' }
        creditTermDays: { type: [integer, 'null'], minimum: 0, maximum: 3650 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        exchangeRate: { $ref: '#/components/schemas/Money' }
        notes: { type: string, maxLength: 2000 }
        lines: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/InvoiceLineInput' } }
    InvoiceLine:
      type: object
      description: DocumentLine v1 del contrato (schemas/events/parts/document-line.v1.json).
      required: [lineNumber, cabysCode, description, unitOfMeasureCode, isService, quantity, unitPrice, discount, subtotal, tax, total, taxes]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        productId: { type: string, format: uuid }
        productCode: { type: string }
        cabysCode: { type: string }
        description: { type: string }
        unitOfMeasureCode: { type: string }
        isService: { type: boolean }
        quantity: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        discountReason: { type: string }
        subtotal: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
