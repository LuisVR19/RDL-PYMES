components:
  messages:
    InvoiceIssued:
      name: InvoiceIssued
      title: InvoiceIssued v1
      summary: Billing emitió una factura (draft → issued).
      description: "Uso: Crear el documento fiscal (fiscal) y la cuenta por cobrar (receivables)."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/invoice-issued.v1.json'
      x-rdl-version: 1
      x-rdl-producer: billing
      x-rdl-consumers: [fiscal, receivables]
    InvoiceCancelled:
      name: InvoiceCancelled
      title: InvoiceCancelled v1
      summary: Billing anuló una factura emitida, con motivo.
      description: "Uso: Iniciar la corrección o el reverso permitido."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/invoice-cancelled.v1.json'
      x-rdl-version: 1
      x-rdl-producer: billing
      x-rdl-consumers: [fiscal, receivables]
    CreditNoteIssued:
      name: CreditNoteIssued
      title: CreditNoteIssued v1
      summary: Billing emitió una nota de crédito sobre una factura.
      description: "Uso: Documento fiscal y ajuste que disminuye el saldo."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/credit-note-issued.v1.json'
      x-rdl-version: 1
      x-rdl-producer: billing
      x-rdl-consumers: [fiscal, receivables]
    DebitNoteIssued:
      name: DebitNoteIssued
      title: DebitNoteIssued v1
      summary: Billing emitió una nota de débito sobre una factura.
      description: "Uso: Documento fiscal y ajuste que aumenta el saldo."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/debit-note-issued.v1.json'
      x-rdl-version: 1
      x-rdl-producer: billing
      x-rdl-consumers: [fiscal, receivables]
    ElectronicDocumentAccepted:
      name: ElectronicDocumentAccepted
      title: ElectronicDocumentAccepted v1
      summary: Hacienda aceptó un documento electrónico.
      description: "Uso: Mostrar la aceptación y habilitar acciones."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/electronic-document-accepted.v1.json'
      x-rdl-version: 1
      x-rdl-producer: fiscal
      x-rdl-consumers: [bff, billing, notifications]
    ElectronicDocumentRejected:
      name: ElectronicDocumentRejected
      title: ElectronicDocumentRejected v1
      summary: Hacienda rechazó un documento electrónico.
      description: "Uso: Alertar y gestionar la corrección (Billing marca requires_correction)."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/electronic-document-rejected.v1.json'
      x-rdl-version: 1
      x-rdl-producer: fiscal
      x-rdl-consumers: [bff, billing, notifications]
    PaymentReceived:
      name: PaymentReceived
      title: PaymentReceived v1
      summary: Receivables registró un pago.
      description: "Uso: Actualizar vistas y notificaciones."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/payment-received.v1.json'
      x-rdl-version: 1
      x-rdl-producer: receivables
      x-rdl-consumers: [bff, reports]
    ReceivableSettled:
      name: ReceivableSettled
      title: ReceivableSettled v1
      summary: El saldo de una cuenta por cobrar llegó a cero.
      description: "Uso: Marcar el saldo cancelado en los read models."
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: '../schemas/events/receivable-settled.v1.json'
      x-rdl-version: 1
      x-rdl-producer: receivables
      x-rdl-consumers: [bff, reports]
