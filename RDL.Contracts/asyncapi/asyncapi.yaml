# Catálogo de eventos v1 (arquitectura 6.2) en AsyncAPI 3.0.
# Cada mensaje apunta a su JSON Schema 2020-12 en schemas/events/. `contractsctl validate` verifica este archivo
# contra el meta-schema oficial de AsyncAPI 3.0.0 y contra el catálogo de la arquitectura: no se agregan eventos
# que no estén ahí (D8), y productor, consumidores, schema y canal tienen que coincidir.
#
# Los canales son nombres lógicos (<productor>.<evento>.v<N>). El broker y el mapeo a colas o tópicos se deciden en
# infraestructura (P2, decisión de mensajería pendiente); por eso no hay `servers`.
asyncapi: 3.0.0
info:
  title: RDL · eventos de integración
  version: 0.1.0
  description: |
    Eventos que se publican vía transactional outbox (integration.outbox_messages) y se consumen con inbox
    idempotente (integration.inbox_messages). Entrega al menos una vez: el consumidor deduplica por eventId.
    Convenciones: docs/convenciones.md §10. Sobre común: schemas/events/envelope.v1.json.
defaultContentType: application/json

channels:
  invoiceIssued:
    address: billing.invoice-issued.v1
    title: InvoiceIssued v1
    messages:
      invoiceIssued:
        $ref: '#/components/messages/InvoiceIssued'
  invoiceCancelled:
    address: billing.invoice-cancelled.v1
    title: InvoiceCancelled v1
    messages:
      invoiceCancelled:
        $ref: '#/components/messages/InvoiceCancelled'
  creditNoteIssued:
    address: billing.credit-note-issued.v1
    title: CreditNoteIssued v1
    messages:
      creditNoteIssued:
        $ref: '#/components/messages/CreditNoteIssued'
  debitNoteIssued:
    address: billing.debit-note-issued.v1
    title: DebitNoteIssued v1
    messages:
      debitNoteIssued:
        $ref: '#/components/messages/DebitNoteIssued'
  electronicDocumentAccepted:
    address: fiscal.electronic-document-accepted.v1
    title: ElectronicDocumentAccepted v1
    messages:
      electronicDocumentAccepted:
        $ref: '#/components/messages/ElectronicDocumentAccepted'
  electronicDocumentRejected:
    address: fiscal.electronic-document-rejected.v1
    title: ElectronicDocumentRejected v1
    messages:
      electronicDocumentRejected:
        $ref: '#/components/messages/ElectronicDocumentRejected'
  paymentReceived:
    address: receivables.payment-received.v1
    title: PaymentReceived v1
    messages:
      paymentReceived:
        $ref: '#/components/messages/PaymentReceived'
  receivableSettled:
    address: receivables.receivable-settled.v1
    title: ReceivableSettled v1
    messages:
      receivableSettled:
        $ref: '#/components/messages/ReceivableSettled'

operations:
  billing.sendInvoiceIssued:
    action: send
    summary: billing publica InvoiceIssued desde su outbox.
    channel:
      $ref: '#/channels/invoiceIssued'
    messages:
      - $ref: '#/channels/invoiceIssued/messages/invoiceIssued'
  fiscal.receiveInvoiceIssued:
    action: receive
    summary: fiscal consume InvoiceIssued.
    channel:
      $ref: '#/channels/invoiceIssued'
    messages:
      - $ref: '#/channels/invoiceIssued/messages/invoiceIssued'
  receivables.receiveInvoiceIssued:
    action: receive
    summary: receivables consume InvoiceIssued.
    channel:
      $ref: '#/channels/invoiceIssued'
    messages:
      - $ref: '#/channels/invoiceIssued/messages/invoiceIssued'
  billing.sendInvoiceCancelled:
