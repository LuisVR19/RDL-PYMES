# Billing API (arquitectura 3.1, planning P4). IMPLEMENTADO en RDL.Billing.API para F2 y F3 (clientes, productos,
# borradores, numeración y emisión); lo de F5 (anulación y notas) sigue como esqueleto y se marca en cada ruta. Los
# campos vienen de la implementación (RDL.Billing.API/api/openapi.yaml) y se traen aquí por PR. La organización sale
# del token (D7): ninguna ruta lleva organizationId. Los comandos de state-machines/invoice.yaml tienen que existir
# aquí (lo verifica validate). Las rutas /internal/ que compone el Portal Gateway están en bff-internal.yaml.
openapi: 3.1.0
info:
  title: Billing API
  version: 0.2.0
  description: >
    Operación comercial de cada organización con sus clientes: clientes, productos, facturas y notas, cálculo de
    montos (redondeo D2, ADR 0007), numeración visible y emisión. Produce InvoiceIssued (y en F5 InvoiceCancelled,
    CreditNoteIssued y DebitNoteIssued). Todo POST exige Idempotency-Key; la misma clave con el mismo cuerpo responde
    lo mismo con el header Idempotent-Replayed: true.
servers:
  - url: http://localhost:8081
security:
  - bearerAuth: []
tags:
  - { name: customers, description: Clientes de la organización }
  - { name: products, description: Productos y servicios }
  - { name: invoices, description: Facturas y notas de crédito o débito }
  - { name: numbering, description: Numeración visible }

paths:
  /v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Lista clientes, ordenados por createdAt e id. Todos los roles.
      parameters:
        - $ref: 'components/common.yaml#/components/parameters/Limit'
        - $ref: 'components/common.yaml#/components/parameters/Cursor'
        - { name: q, in: query, description: 'Contiene, en razón social, nombre comercial o número de identificación.', schema: { type: string, maxLength: 100 } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Página de clientes, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
        '401': { $ref: 'components/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Crea un cliente activo. Identificación única por organización (409 customer-identification-taken). owner, admin, biller.
      parameters: [{ $ref: 'components/common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'components/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
  /v1/customers/{id}:
    parameters: [{ $ref: 'components/common.yaml#/components/parameters/Id' }]
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Detalle. Todos los roles.
      responses:
        '200': { description: Cliente, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: 'components/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
    patch:
      tags: [customers]
      operationId: updateCustomer
      summary: Edita o desactiva (isActive false). La identificación no se edita. No altera documentos emitidos (snapshots). owner, admin, biller.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPatch' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }

  /v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Lista productos y servicios con sus impuestos, ordenados por createdAt e id. Todos los roles.
      parameters:
        - $ref: 'components/common.yaml#/components/parameters/Limit'
        - $ref: 'components/common.yaml#/components/parameters/Cursor'
        - { name: q, in: query, description: 'Contiene, en código o descripción.', schema: { type: string, maxLength: 100 } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Página de productos, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '401': { $ref: 'components/common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
    post:
      tags: [products]
      operationId: createProduct
      summary: Crea un producto o servicio con CABYS e impuestos. Código único por organización (409 product-code-taken). owner, admin, biller.
      parameters: [{ $ref: 'components/common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
  /v1/products/{id}:
    parameters: [{ $ref: 'components/common.yaml#/components/parameters/Id' }]
    get:
      tags: [products]
      operationId: getProduct
      summary: Detalle con impuestos. Todos los roles.
      responses:
        '200': { description: Producto, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Edita o desactiva. Solo los campos enviados; taxes reemplaza la lista. No altera documentos emitidos. owner, admin, biller.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPatch' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }

  /v1/invoices:
    get:
      tags: [invoices]
      operationId: listInvoices
      summary: Lista facturas y notas con líneas, ordenadas por createdAt e id. Todos los roles.
      parameters:
        - $ref: 'components/common.yaml#/components/parameters/Limit'
        - $ref: 'components/common.yaml#/components/parameters/Cursor'
        - { name: documentType, in: query, schema: { $ref: 'components/common.yaml#/components/schemas/DocumentType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - { name: customerId, in: query, schema: { $ref: 'components/common.yaml#/components/schemas/Uuid' } }
        - { name: requiresCorrection, in: query, schema: { type: boolean } }
        - { name: issuedFrom, in: query, description: 'Fecha de emisión desde (inclusive), en la zona horaria de la organización. Un borrador no tiene fecha y no aparece.', schema: { $ref: 'components/common.yaml#/components/schemas/BusinessDate' } }
        - { name: issuedTo, in: query, description: 'Fecha de emisión hasta (inclusive), en la zona horaria de la organización.', schema: { $ref: 'components/common.yaml#/components/schemas/BusinessDate' } }
      responses:
        '200': { description: Página de documentos, content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePage' } } } }
        '401': { $ref: 'components/common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
    post:
      tags: [invoices]
      operationId: createInvoice
      summary: Crea un borrador (draft) con líneas opcionales. owner, admin, biller.
      description: >
        customerId, branchId y cada productId se validan contra la organización activa (ajeno o inexistente: 404;
        cliente inactivo: 422 customer-inactive). El snapshot de cada línea y la tasa de sus impuestos salen del
        producto y del catálogo fiscal.tax_rates, nunca del cuerpo. exchangeRate es 1 en la moneda local de la
        organización (se asume si falta) y obligatorio en otra.
      parameters: [{ $ref: 'components/common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDraftInput' } } } }
      responses:
        '201': { description: Borrador creado, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
  /v1/invoices/{id}:
    parameters: [{ $ref: 'components/common.yaml#/components/parameters/Id' }]
    get:
      tags: [invoices]
      operationId: getInvoice
      summary: Detalle con líneas, impuestos y totales. Todos los roles.
      responses:
        '200': { description: Documento, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
    patch:
      tags: [invoices]
      operationId: updateInvoiceDraft
      summary: Edita el encabezado (y reemplaza las líneas si vienen). Solo en draft (409 invoice-not-draft). owner, admin, biller.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDraftPatch' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
    delete:
      tags: [invoices]
      operationId: discardInvoiceDraft
      summary: Descarta un borrador (se borra la fila; queda en la auditoría). Nunca un documento emitido (409). owner, admin, biller.
      responses:
        '204': { description: Descartado }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
  /v1/invoices/{id}/lines:
    parameters: [{ $ref: 'components/common.yaml#/components/parameters/Id' }]
    put:
      tags: [invoices]
      operationId: replaceInvoiceLines
      summary: Reemplaza las líneas del borrador y recalcula (redondeo D2). Solo en draft. owner, admin, biller.
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/InvoiceLineInput' } } } }
      responses:
        '200': { description: Documento recalculado, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
  /v1/invoices/{id}/issue:
    parameters: [{ $ref: 'components/common.yaml#/components/parameters/Id' }]
    post:
      tags: [invoices]
      operationId: issueInvoice
      summary: draft → issued. Copia snapshots, asigna número y escribe el evento en el outbox en la misma transacción. Responde sin llamar a otros servicios. owner, admin, biller.
      description: >
        Revalida cliente, sucursal y productos activos; exige al menos una línea (422 invoice-without-lines). La misma
        Idempotency-Key responde el mismo 201; emitir un documento ya emitido con otra clave es 409
        invoice-not-draft. issuedAt en UTC; dueDate = fecha de emisión (zona de la organización) + creditTermDays.
      parameters: [{ $ref: 'components/common.yaml#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Emitido, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
  /v1/invoices/{id}/cancel:
    parameters: [{ $ref: 'components/common.yaml#/components/parameters/Id' }]
    post:
      tags: [invoices]
      operationId: cancelInvoice
      summary: issued → cancelled con motivo obligatorio. Emite InvoiceCancelled en el outbox, en la misma transacción. owner, admin.
      description: >
        Solo una factura emitida: un borrador o una factura ya anulada es 409 invoice-not-issued; una nota es 409
        conflict (TODO(fiscal) de la máquina de estados: si una nota se puede anular). No llama a ningún servicio:
        Receivables ajusta la cuenta al consumir InvoiceCancelled y fiscal decide la corrección ante Hacienda (ESTADO
        §3: si genera la nota de crédito código 01 desde el evento). La misma Idempotency-Key responde el mismo 200.
      parameters: [{ $ref: 'components/common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        '200': { description: Anulado, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }
  /v1/invoices/{id}/history:
    parameters: [{ $ref: 'components/common.yaml#/components/parameters/Id' }]
    get:
      tags: [invoices]
      operationId: getInvoiceHistory
      summary: Transiciones de estado (billing.invoice_status_history). Crear o descartar un borrador no es una transición. Todos los roles.
      responses:
        '200':
          description: Cambios de estado, del más antiguo al más reciente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [toStatus, changedAt]
                  properties:
                    fromStatus: { $ref: '#/components/schemas/InvoiceStatus' }
                    toStatus: { $ref: '#/components/schemas/InvoiceStatus' }
                    reason: { type: string }
                    changedByUserId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
                    changedAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }

  /v1/document-sequences:
    get:
      tags: [numbering]
      operationId: listDocumentSequences
      summary: Secuencias de numeración visible por tipo de documento y sucursal. owner, admin.
      responses:
        '200':
          description: Secuencias
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DocumentSequence' } }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
  /v1/document-sequences/{documentType}:
    parameters:
      - { name: documentType, in: path, required: true, schema: { $ref: 'components/common.yaml#/components/schemas/DocumentType' } }
    put:
      tags: [numbering]
      operationId: configureDocumentSequence
      summary: Configura prefijo y próximo número, de la organización o de una sucursal (branchId), solo si la secuencia aún no se usó. owner, admin.
      description: >
        409 sequence-in-use si ya asignó números; 409 conflict si otra secuencia del mismo tipo usa el prefijo (sus
        números chocarían). Número visible = prefijo + número con 8 dígitos (ADR 0006 de Billing). Al emitir se usa la
        secuencia de la sucursal del documento, si no la de la organización, y si no existe se crea (prefijo vacío, desde 1).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentSequenceInput' } } } }
      responses:
        '200': { description: Configurada, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentSequence' } } } }
        '400': { $ref: 'components/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'components/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'components/common.yaml#/components/responses/UnprocessableEntity' }

components:
  securitySchemes:
    bearerAuth: { $ref: 'components/common.yaml#/components/securitySchemes/bearerAuth' }
  schemas:
    InvoiceStatus: { type: string, enum: [draft, issued, cancelled], description: state-machines/invoice.yaml }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [identification, legalName]
      properties:
        identification: { $ref: 'components/common.yaml#/components/schemas/Identification' }
        legalName: { type: string, minLength: 1, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 500, description: 'TODO(fiscal): provincia, cantón y distrito si los exige el comprobante.' }
    CustomerPatch:
      type: object
      additionalProperties: false
      description: Campo ausente = no cambia; "" en tradeName, email, phone o address lo borra. La identificación no se edita.
      properties:
        legalName: { type: string, minLength: 1, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254, description: 'Un email válido, o "" para borrarlo.' }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 500 }
        isActive: { type: boolean }
    Customer:
      type: object
      additionalProperties: false
      required: [id, identification, legalName, isActive, createdAt, updatedAt]
      properties:
        id: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        identification: { $ref: 'components/common.yaml#/components/schemas/Identification' }
        legalName: { type: string, maxLength: 200 }
        tradeName: { type: string, maxLength: 200, description: Se omite si está vacío. }
        email: { type: string, format: email, maxLength: 254, description: Se omite si está vacío. }
        phone: { type: string, maxLength: 30, description: Se omite si está vacío. }
        address: { type: string, maxLength: 500, description: Se omite si está vacío. }
        isActive: { type: boolean }
        createdAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
        updatedAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
    CustomerPage:
      allOf:
        - $ref: 'components/common.yaml#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Customer' } } }
    ProductTax:
      type: object
      additionalProperties: false
      description: Impuesto del producto por código. La tasa (porcentaje) no se guarda aquí; sale de fiscal.tax_rates al armar la línea.
      required: [taxTypeCode, taxRateCode]
      properties:
        taxTypeCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
        taxRateCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
    ProductInput:
      type: object
      additionalProperties: false
      required: [code, description, cabysCode, unitOfMeasureCode, unitPrice, currency, isService]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, minLength: 1, maxLength: 200 }
        cabysCode: { $ref: 'components/common.yaml#/components/schemas/CabysCode' }
        unitOfMeasureCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
        unitPrice: { $ref: 'components/common.yaml#/components/schemas/Money' }
        currency: { $ref: 'components/common.yaml#/components/schemas/CurrencyCode' }
        isService: { type: boolean }
        isActive: { type: boolean, default: true }
        taxes: { type: array, items: { $ref: '#/components/schemas/ProductTax' }, description: A lo sumo uno por taxTypeCode. }
    ProductPatch:
      type: object
      additionalProperties: false
      description: Campo ausente = no cambia; taxes presente reemplaza la lista ([] la vacía). Un ProductInput completo también es válido.
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, minLength: 1, maxLength: 200 }
        cabysCode: { $ref: 'components/common.yaml#/components/schemas/CabysCode' }
        unitOfMeasureCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
        unitPrice: { $ref: 'components/common.yaml#/components/schemas/Money' }
        currency: { $ref: 'components/common.yaml#/components/schemas/CurrencyCode' }
        isService: { type: boolean }
        isActive: { type: boolean }
        taxes: { type: array, items: { $ref: '#/components/schemas/ProductTax' } }
    Product:
      type: object
      additionalProperties: false
      required: [id, code, description, cabysCode, unitOfMeasureCode, unitPrice, currency, isService, isActive, taxes, createdAt, updatedAt]
      properties:
        id: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 200 }
        cabysCode: { $ref: 'components/common.yaml#/components/schemas/CabysCode' }
        unitOfMeasureCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
        unitPrice: { $ref: 'components/common.yaml#/components/schemas/Money' }
        currency: { $ref: 'components/common.yaml#/components/schemas/CurrencyCode' }
        isService: { type: boolean }
        isActive: { type: boolean }
        taxes: { type: array, items: { $ref: '#/components/schemas/ProductTax' }, description: Ordenados por taxTypeCode. }
        createdAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
        updatedAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
    ProductPage:
      allOf:
        - $ref: 'components/common.yaml#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } } }
    InvoiceLineInput:
      type: object
      additionalProperties: false
      required: [quantity]
      description: >
        Con productId se toman CABYS, descripción, unidad e impuestos del producto; unitPrice (opcional) reemplaza su
        precio y es obligatorio si el producto está en otra moneda que el documento. Billing v1 exige productId (422 si
        falta): la línea libre, con sus propios campos, se define cuando se implemente.
      properties:
        productId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        quantity: { $ref: 'components/common.yaml#/components/schemas/Quantity' }
        unitPrice: { $ref: 'components/common.yaml#/components/schemas/Money' }
        discount: { $ref: 'components/common.yaml#/components/schemas/Money' }
        discountReason: { type: string, maxLength: 80, description: Obligatorio si discount no es cero. }
    InvoiceDraftInput:
      type: object
      additionalProperties: false
      required: [documentType, customerId, saleConditionCode, currency]
      properties:
        documentType: { $ref: 'components/common.yaml#/components/schemas/DocumentType' }
        customerId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        branchId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        referencedInvoiceId:
          $ref: 'components/common.yaml#/components/schemas/Uuid'
          description: >
            Obligatorio en credit_note y debit_note; prohibido en invoice. Una factura emitida del mismo cliente y la
            misma moneda (inexistente, de otra organización, borrador, otra nota u otro cliente: 422 invalid-reference;
            anulada: 409 invoice-not-issued; otra moneda: 422 validation en currency).
        referenceReason: { type: string, minLength: 1, maxLength: 500, description: 'Obligatorio en las notas. TODO(fiscal): código de referencia de Hacienda.' }
        saleConditionCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
        creditTermDays: { type: integer, minimum: 0, maximum: 3650 }
        currency: { $ref: 'components/common.yaml#/components/schemas/CurrencyCode' }
        exchangeRate: { $ref: 'components/common.yaml#/components/schemas/ExchangeRate', description: 1 en la moneda local (se asume si falta); obligatorio en otra. }
        notes: { type: string, maxLength: 2000 }
        lines: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/InvoiceLineInput' } }
    InvoiceDraftPatch:
      type: object
      additionalProperties: false
      description: >
        Campo ausente = no cambia; branchId o creditTermDays en null los quitan; lines presente reemplaza las líneas.
        Un InvoiceDraftInput completo también es válido. documentType y referencedInvoiceId no cambian (si vienen, iguales
        a los del documento); el motivo de una nota sí. Cambiar la moneda de un borrador con líneas exige reenviar las
        líneas.
      properties:
        documentType: { $ref: 'components/common.yaml#/components/schemas/DocumentType' }
        referencedInvoiceId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        referenceReason: { type: string, minLength: 1, maxLength: 500 }
        customerId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        branchId: { oneOf: [{ $ref: 'components/common.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
        saleConditionCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
        creditTermDays: { type: [integer, 'null'], minimum: 0, maximum: 3650 }
        currency: { $ref: 'components/common.yaml#/components/schemas/CurrencyCode' }
        exchangeRate: { $ref: 'components/common.yaml#/components/schemas/ExchangeRate' }
        notes: { type: string, maxLength: 2000 }
        lines: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/InvoiceLineInput' } }
    Invoice:
      type: object
      additionalProperties: false
      description: >
        Emitido, los datos del cliente (customerSnapshot) y de las líneas son los snapshots del evento y no cambian. En
        borrador, number es null y no hay customerSnapshot, issuedAt ni dueDate.
      required: [id, documentType, number, status, requiresCorrection, customerId, saleConditionCode, currency, exchangeRate, lines, subtotal, discount, tax, exoneration, total, createdAt, updatedAt]
      properties:
        id: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        documentType: { $ref: 'components/common.yaml#/components/schemas/DocumentType' }
        number: { type: [string, 'null'], maxLength: 50, description: Número visible (prefijo + 8 dígitos); null en draft. }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        requiresCorrection: { type: boolean }
        fiscalRejectionReason: { type: string }
        referencedInvoiceId: { $ref: 'components/common.yaml#/components/schemas/Uuid', description: Solo notas. }
        referenceReason: { type: string, description: Solo notas. }
        cancellationReason: { type: string, description: Solo anuladas (CHECK invoices_cancelled_ck). }
        cancelledAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime', description: Solo anuladas. }
        cancelledByUserId: { $ref: 'components/common.yaml#/components/schemas/Uuid', description: Solo anuladas. }
        customerId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        customerSnapshot: { $ref: '../schemas/common/customer-snapshot.json' }
        branchId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        saleConditionCode: { $ref: 'components/common.yaml#/components/schemas/FiscalCode' }
        creditTermDays: { type: integer, minimum: 0 }
        issuedAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
        dueDate: { $ref: 'components/common.yaml#/components/schemas/BusinessDate' }
        currency: { $ref: 'components/common.yaml#/components/schemas/CurrencyCode' }
        exchangeRate: { $ref: 'components/common.yaml#/components/schemas/ExchangeRate' }
        notes: { type: string, maxLength: 2000 }
        lines: { type: array, items: { $ref: '../schemas/events/parts/document-line.v1.json' } }
        subtotal: { $ref: 'components/common.yaml#/components/schemas/Money' }
        discount: { $ref: 'components/common.yaml#/components/schemas/Money' }
        tax: { $ref: 'components/common.yaml#/components/schemas/Money', description: Impuestos antes de exoneraciones. }
        exoneration: { $ref: 'components/common.yaml#/components/schemas/Money' }
        total: { $ref: 'components/common.yaml#/components/schemas/Money' }
        createdAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
        updatedAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
    InvoicePage:
      allOf:
        - $ref: 'components/common.yaml#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Invoice' } } }
    DocumentSequenceInput:
      type: object
      additionalProperties: false
      required: [prefix, nextNumber]
      properties:
        documentType: { $ref: 'components/common.yaml#/components/schemas/DocumentType', description: Si viene, igual al de la ruta. }
        branchId: { $ref: 'components/common.yaml#/components/schemas/Uuid', description: Ausente = la secuencia de toda la organización. }
        prefix: { type: string, pattern: '^[A-Za-z0-9._/-]{0,10}$' }
        nextNumber: { type: integer, minimum: 1, maximum: 999999999999999 }
    DocumentSequence:
      type: object
      additionalProperties: false
      required: [documentType, prefix, nextNumber, used, updatedAt]
      properties:
        documentType: { $ref: 'components/common.yaml#/components/schemas/DocumentType' }
        branchId: { $ref: 'components/common.yaml#/components/schemas/Uuid' }
        prefix: { type: string, maxLength: 10 }
        nextNumber: { type: integer, minimum: 1 }
        used: { type: boolean, description: Ya asignó números; no se puede reconfigurar. }
        updatedAt: { $ref: 'components/common.yaml#/components/schemas/UtcDateTime' }
