version: "2"
sql:
  - engine: postgresql
    schema:
      - sqlc/external.sql
      - migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/adapters/postgres/db
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: timestamptz
            go_type: time.Time
